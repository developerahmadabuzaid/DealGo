name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The integration suite starts its own PostgreSQL container via Testcontainers, so the
      # concurrency guarantees are exercised against a real database rather than a fake.
      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=results.trx" --results-directory artifacts/test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: artifacts/test

      # Fails if the model has drifted from the checked-in migrations.
      - name: Validate migrations
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.*
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations script --idempotent \
            --project src/AuctionPlatform.Infrastructure \
            --startup-project src/AuctionPlatform.Api \
            --output artifacts/migrate.sql
          dotnet ef migrations has-pending-model-changes \
            --project src/AuctionPlatform.Infrastructure \
            --startup-project src/AuctionPlatform.Api

      - name: Upload migration script
        uses: actions/upload-artifact@v4
        with:
          name: migration-script
          path: artifacts/migrate.sql

  security:
    name: Security checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          grep -q "has the following vulnerable packages" vulnerable.txt && exit 1 || exit 0

      - name: Deprecated packages
        continue-on-error: true
        run: dotnet list package --deprecated

      # Real secrets belong in the environment, never in the repository.
      # appsettings.Development.json is exempt: its values are deliberate local placeholders and
      # that file is never deployed. Every other appsettings must ship with empty secrets.
      - name: No committed secrets
        run: |
          found=$(git ls-files 'src/**/appsettings*.json' \
                  | grep -v 'appsettings.Development.json' \
                  | xargs grep -En '"(Secret|Password|WebhookSecret|ApiKey)"[[:space:]]*:[[:space:]]*"[^"]{8,}"' || true)
          if [ -n "$found" ]; then
            echo "A non-empty secret is committed:"
            echo "$found"
            exit 1
          fi
          echo "No committed secrets."

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/AuctionPlatform.Api/Dockerfile
          push: false
          tags: auction-platform-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  mobile:
    name: Flutter
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release --dart-define=API_BASE_URL=https://api.example.com
