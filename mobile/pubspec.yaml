name: mobile
description: "Real-time auction platform — mobile client."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management. Riverpod keeps the view models testable and free of BuildContext.
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # HTTP. Interceptors handle bearer tokens and refresh-token rotation in one place.
  dio: ^5.7.0

  # Real-time. The SignalR client mirrors the backend hub.
  signalr_netcore: ^1.3.7

  # Tokens are kept in the platform keystore, never in shared preferences.
  flutter_secure_storage: ^9.2.2

  # Formatting and localization helpers (Arabic numerals, currency, dates).
  intl: ^0.20.2

  shared_preferences: ^2.3.3

  # An advertisement may point at an address outside the app; this opens it in the phone browser.
  url_launcher: ^6.3.1

  # The live bidding screen's music: a steady loop, and a faster one for the final phase.
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: false

  assets:
    # The picture behind the top bar, including the space behind the phone's status bar.
    - assets/images/
    # Advertisement artwork. A folder is not covered by the line above, which is one level only.
    - assets/images/ads/
    # The live bidding screen's two music loops.
    - assets/audio/

  fonts:
    # The Saudi Riyal sign. Ordinary fonts do not carry it yet, so it is drawn from this one:
    # a single glyph at U+E900, listed as a fallback so it is used for that character only.
    - family: RiyalSign
      fonts:
        - asset: assets/fonts/RiyalSign.ttf
