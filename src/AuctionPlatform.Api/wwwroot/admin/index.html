<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DealGo · لوحة الإدارة</title>
  <link rel="icon" href="/admin/logo.png" />

  <!--
    Cairo covers Arabic and Latin in one family, so headings, figures and auction numbers
    share a single set of shapes. It is a progressive improvement: the stack in styles.css
    keeps the console readable on a machine with no internet access.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="/admin/styles.css" />
</head>
<body>
  <!--
    Admin dashboard.

    It is a thin client over the same API the mobile app uses. Every permission check that matters
    happens on the server: hiding a nav item here is a convenience, never a security control.
  -->
  <div id="app"></div>
  <script src="/admin/app.js"></script>
</body>
</html>
